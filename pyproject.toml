[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "paper_voice"
version = "0.3.0"
description = "Convert academic papers to high-quality audio with precise mathematical explanations and intelligent content processing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    {name = "Gaurav Sood", email = "gsood07@gmail.com"}
]
dependencies = [
    "streamlit>=1.30.0",
    "pypdf>=6.1",
    "pyttsx3>=2.90",
    "regex>=2024.2.2",
    "pydub>=0.25.1",
    "openai>=1.0.0",
    "PyMuPDF>=1.23.0",
    "requests>=2.31.0"
]

[project.urls]
homepage = "https://github.com/gojiplus/paper_voice"
repository = "https://github.com/gojiplus/paper_voice"
documentation = "https://gojiplus.github.io/paper_voice"

[project.scripts]
paper_voice = "paper_voice.cli:cli_entry_point"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests"
]

[tool.coverage.run]
source = ["paper_voice"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF"]
"docs/**" = ["D"]
# print() is the user-facing output channel for the CLI and the demo scripts.
"src/paper_voice/cli.py" = ["T201"]
"demos/**" = ["T20"]

[tool.preen]
# lychee truncates an f-string URL at the brace, so the arXiv API bases are
# extracted as bare paths that 404 by construction; the IDs in the arXiv tests
# are deliberately fake. The Pages site 404s until the first docs deploy from
# main, which cannot happen until this adoption lands.
# The patterns omit the scheme on purpose: lychee scans this file too, and a
# pattern written with one is itself extracted as a (dead) link.
link_ignore = [
    "arxiv\\.org/(e-print|abs)/",
    "gojiplus\\.github\\.io/paper_voice",
]

[tool.codespell]
# "complier"/"compliers" are the econometrics terms (LATE compliers), not
# "compiler"; "multline" and "oint" are LaTeX names (\begin{multline}, \oint).
ignore-words-list = "complier,compliers,multline,oint"

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'


[dependency-groups]
dev = [
    "ruff>=0.14",
    "pyright>=1.1.390",
    "pydoclint>=0.5",
    "pre-commit>=4",
    { include-group = "test" },
]
test = ["pytest>=8", "pytest-cov>=6"]
docs = [
    "sphinx>=8",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
]
